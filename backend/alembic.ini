[alembic]
script_location = alembic

# sqlalchemy.url is deliberately NOT set here — env.py reads DATABASE_URL
# from the environment at runtime (the same variable database.py/models.py
# use), so migrations always run against whichever database the app
# itself is configured for, instead of a second, easy-to-forget place to
# keep in sync.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
